[main]
font=monospace:weight=light:size=14
initial-window-size-pixels=800x500
pad=10x10
bold-text-in-bright=yes

[bell]
urgent=yes

[desktop-notifications]
command=notify-send -a ${app-id} -i ${app-id} ${title} ${body}

[colors]
background=fafef9 # w tix0
foreground=0b0e0d # k tees
regular0=fafef9   # w tix0
regular1=f75f59   # r shot0
regular2=52bb62   # g grass
regular3=e3d169   # y shot1
regular4=00a4ff   # b case0
regular5=6e86c4   # m shot2
regular6=6dd6fc   # c plate
regular7=292e2f   # k ipad
bright0=dae0d5    # k tix2
bright1=f75f59    # r shot0
bright2=52bb62    # g grass
bright3=e3d169    # y shot1
bright4=00a4ff    # b case0
bright5=6e86c4    # m shot2
bright6=6dd6fc    # c plate
bright7=fafef9    # w tix0
alpha=0.95
