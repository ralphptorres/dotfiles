[save]
autosave_delay = 1000
autosave = "off"
format_on_save = false

[language_servers.pylsp]
enable_pylint = false
enable_mypy = true
enable_pydocstyle = false
enable_pyflakes = false
enable_ruff = true
enable_flake8 = false
enabled = true

[formatting]
line_length = 79

[package_management]
manager = "uv"

[snippets]
custom_paths = []
include_default_snippets = true

[ai]
mode = "manual"
rules = ""

[display]
reference_highlighting = false
code_editor_font_size = 14
default_width = "full"
cell_output = "above"
default_table_page_size = 10
dataframes = "rich"
theme = "system"

[completion]
copilot = false
activate_on_typing = true

[diagnostics]
enabled = true

[experimental]

[server]
browser = "default"
follow_symlink = false

[runtime]
std_stream_max_bytes = 1000000
auto_reload = "autorun"
on_cell_change = "autorun"
default_sql_output = "auto"
auto_instantiate = true
watcher_on_save = "autorun"
reactive_tests = true
output_max_bytes = 8000000

[keymap]
preset = "vim"

[keymap.overrides]
